<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Master A1-A2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f0fdf4; /* Green-50 */
        }
        .eng-font {
            font-family: 'Nunito', sans-serif;
        }
        .card-shadow {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .btn-bounce:active {
            transform: scale(0.95);
        }
        .correct-anim {
            animation: pulse-green 0.5s;
        }
        .wrong-anim {
            animation: shake 0.5s;
        }
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); transform: scale(1); }
            70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); transform: scale(1.02); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); transform: scale(1); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #888; 
            border-radius: 4px;
        }
        
        /* Toggle Switch */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #68D391;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #68D391;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center text-gray-800 bg-gradient-to-br from-green-100 to-blue-100 p-4">

    <!-- App Container -->
    <div id="app" class="w-full max-w-md bg-white rounded-3xl card-shadow overflow-hidden min-h-[650px] relative flex flex-col">

        <header class="bg-indigo-600 text-white p-4 text-center relative z-10 flex justify-center items-center shadow-md">
            <div class="flex-grow text-center">

                <p class="text-xs text-indigo-200">Oxford 3000 Edition</p>
            </div>
        </header>

        <!-- Content Area -->
        <main class="flex-grow p-6 flex flex-col items-center justify-center relative w-full overflow-y-auto">

            <div id="menu-view" class="w-full space-y-4 text-center transition-all duration-300">
                <div class="mb-6">
                    <img src="https://cdn-icons-png.flaticon.com/512/330/330425.png" alt="English Learning" class="w-24 h-24 mx-auto mb-4 opacity-80">
                    <h2 class="text-2xl font-bold text-gray-700">เลือกโหมดฝึกฝน</h2>
                    <p class="text-gray-500 text-sm mt-2">เพิ่มคลังคำศัพท์ของคุณ</p>
                </div>

                <button onclick="startGame('vocab')" class="btn-bounce w-full bg-white border-2 border-orange-400 p-4 rounded-2xl flex items-center shadow-sm hover:shadow-md transition-all group">
                    <div class="bg-orange-100 p-3 rounded-full mr-4 group-hover:bg-orange-200 transition">
                        <span class="text-2xl">📖</span>
                    </div>
                    <div class="text-left">
                        <h3 class="font-bold text-lg text-gray-800">คำศัพท์ (Vocabulary)</h3>
                        <p class="text-xs text-gray-500">รวมศัพท์ A1-A2 จากไฟล์</p>
                    </div>
                </button>

                <button onclick="startGame('phonetic')" class="btn-bounce w-full bg-white border-2 border-purple-400 p-4 rounded-2xl flex items-center shadow-sm hover:shadow-md transition-all group">
                    <div class="bg-purple-100 p-3 rounded-full mr-4 group-hover:bg-purple-200 transition">
                        <span class="text-2xl">🗣️</span>
                    </div>
                    <div class="text-left">
                        <h3 class="font-bold text-lg text-gray-800">การออกเสียง (Phonetics)</h3>
                        <p class="text-xs text-gray-500">ฝึกฟังเสียงและสัญลักษณ์</p>
                    </div>
                </button>
            </div>

            <!-- VIEW: GAME -->
            <div id="game-view" class="w-full hidden flex-col h-full relative pt-2">
                
                <!-- Top Control Bar (Score & Quit) -->
                <div class="flex justify-between items-center mb-4 w-full bg-gray-50 p-2 rounded-lg border border-gray-200">
                    <div class="flex items-center gap-2">
                        <span id="question-count" class="bg-indigo-100 text-indigo-700 px-2 py-1 rounded-md text-xs font-bold">ข้อ 1</span>
                        <span class="bg-yellow-100 text-yellow-700 px-2 py-1 rounded-md text-xs font-bold flex items-center gap-1">
                            ⭐ <span id="score-display">0</span>
                        </span>
                    </div>
                    
                    <!-- Quit Button (Moved here to avoid overlap) -->
                    <button onclick="endGameManually()" class="text-gray-400 hover:text-red-500 p-1 transition bg-white rounded-full shadow-sm border border-gray-200">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>

                <!-- Toggle Switch (Vocab only) -->
                <div id="mode-toggle-container" class="flex items-center justify-center gap-2 mb-4 w-full">
                    <span class="text-xs text-gray-500 font-medium">ซ่อนคำศัพท์ (โชว์ IPA)</span>
                    <div class="relative inline-block w-10 align-middle select-none transition duration-200 ease-in">
                        <input type="checkbox" name="toggle" id="ipa-toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer border-gray-300 transition-all duration-300 top-0 left-0"/>
                        <label for="ipa-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer transition-colors duration-300"></label>
                    </div>
                </div>

                <!-- Question Card -->
                <div class="bg-gray-50 rounded-2xl p-6 border border-gray-100 shadow-inner mb-4 text-center relative flex-grow flex flex-col justify-center items-center min-h-[200px]">
                    
                    <!-- Sound Button -->
                    <button onclick="speakCurrentWord()" class="absolute top-3 right-3 bg-blue-100 hover:bg-blue-200 text-blue-600 rounded-full p-2 transition shadow-sm z-20">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                        </svg>
                    </button>

                    <div id="question-content" class="w-full transition-all duration-300">
                        <!-- Content injected by JS -->
                    </div>
                </div>

                <!-- Options -->
                <div id="options-container" class="grid grid-cols-1 gap-3 w-full mb-4">
                    <!-- Buttons injected by JS -->
                </div>

                <!-- Feedback Area (Clickable to next) -->
                <div id="feedback-area" onclick="handleFeedbackClick()" class="h-10 flex items-center justify-center cursor-pointer hover:bg-gray-50 rounded-lg transition">
                    <p id="feedback-text" class="text-lg font-bold"></p>
                    <span id="tap-hint" class="hidden text-xs text-gray-400 ml-2">(แตะเพื่อไปต่อ)</span>
                </div>

            </div>

            <!-- VIEW: RESULT -->
            <div id="result-view" class="hidden w-full text-center">
                <div class="mb-6">
                    <div class="inline-block p-4 rounded-full bg-blue-100 text-6xl mb-4 animate-bounce">
                        🏁
                    </div>
                    <h2 class="text-3xl font-bold text-gray-800">สรุปผลการฝึก</h2>
                    <p class="text-gray-500">การฝึกฝนคือหัวใจของความสำเร็จ</p>
                </div>

                <div class="bg-white border-2 border-indigo-100 rounded-2xl p-6 mb-8 shadow-sm">
                    <p class="text-gray-600 mb-2">คะแนนรวมของคุณ</p>
                    <div class="text-5xl font-extrabold text-indigo-600 mb-2 eng-font">
                        <span id="final-score">0</span> / <span id="total-score">0</span>
                    </div>
                    <p id="result-message" class="text-sm font-bold text-orange-500"></p>
                </div>

                <div class="space-y-3">
                    <button onclick="showMenu()" class="w-full bg-gray-200 text-gray-700 py-3 rounded-xl font-bold hover:bg-gray-300 transition">
                        กลับหน้าหลัก
                    </button>
                    <button onclick="retryGame()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition shadow-lg">
                        เล่นต่อ
                    </button>
                </div>
            </div>

        </main>
    </div>

        // --- CORE FUNCTIONS ---

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Helper to generate distractors for Vocab mode
        function getVocabOptions(correctWordObj, allWords) {
            let options = [correctWordObj.m]; // Add correct meaning
            
            // Pick 3 random unique distractors
            while (options.length < 4) {
                const randomItem = allWords[Math.floor(Math.random() * allWords.length)];
                if (randomItem.m !== correctWordObj.m && !options.includes(randomItem.m)) {
                    options.push(randomItem.m);
                }
            }
            return shuffleArray(options);
        }

        function startGame(mode) {
            currentMode = mode;
            score = 0;
            totalAnswered = 0;
            currentDataIndex = 0;
            isAnswered = false;

            // Show/Hide Toggle based on mode
            if (mode === 'vocab') {
                modeToggleContainer.classList.remove('hidden');
                modeToggleContainer.classList.add('flex');
                // Shuffle ALL vocab data once at start
                currentQuestions = shuffleArray([...vocabRawList]);
            } else {
                modeToggleContainer.classList.add('hidden');
                modeToggleContainer.classList.remove('flex');
                // Use Phonetic Data
                currentQuestions = shuffleArray([...phoneticData]);
            }

            // UI Switch
            menuView.classList.add('hidden');
            resultView.classList.add('hidden');
            gameView.classList.remove('hidden');
            gameView.classList.add('flex');

            renderQuestion();
        }

        function speakCurrentWord() {
            let textToSpeak = "";
            let rate = 0.8;
            
            if (currentMode === 'vocab') {
                textToSpeak = currentQuestions[currentDataIndex].w;
            } else {
                // In Phonetic mode, speak the representative sound text
                textToSpeak = currentQuestions[currentDataIndex].soundText;
                rate = 0.6; // Slower for single sounds
            }
            
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.lang = 'en-US';
                utterance.rate = rate; 
                window.speechSynthesis.speak(utterance);
            } else {
                console.log("Browser does not support Text-to-Speech");
            }
        }

        function renderQuestion(resetOptions = true) {
            isAnswered = false;
            // nextBtn.classList.add('hidden');
            feedbackText.textContent = '';
            feedbackArea.className = "h-10 flex items-center justify-center cursor-pointer hover:bg-gray-50 rounded-lg transition"; 
            tapHint.classList.add('hidden');

            const q = currentQuestions[currentDataIndex];
            scoreDisplay.textContent = score;
            questionCount.textContent = `ข้อที่ ${totalAnswered + 1}`;
            
            let options = [];

            // Render Content based on Mode & Toggle
            if (currentMode === 'vocab') {
                const isHiddenMode = ipaToggle.checked;
                
                // Generate Dynamic Options for Vocab
                if (resetOptions) {
                    options = getVocabOptions(q, vocabRawList);
                    q.tempOptions = options;
                } else {
                    options = q.tempOptions;
                }

                if (isHiddenMode) {
                    questionContent.innerHTML = `

                        </div>
                    `;
                } else {
                    questionContent.innerHTML = `

                    `;
                }

            } else {
                // Phonetic Mode (Static Options)
                if (resetOptions) {
                    options = shuffleArray([...q.options]);
                    q.tempOptions = options;
                } else {
                    options = q.tempOptions;
                }

                // New Phonetic Display: Big Symbol
                questionContent.innerHTML = `
                    <h2 class="text-7xl font-extrabold text-purple-600 mb-2 eng-font">${q.symbol}</h2>
                    <p class="text-xs text-gray-500 mt-2">${q.desc}</p>
                    <p class="text-sm mt-4 text-indigo-500 font-bold">สัญลักษณ์นี้คือเสียงตัวอะไร?</p>
                `;
            }

            // Render Options
            optionsContainer.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "w-full bg-white border border-gray-200 py-3 rounded-xl hover:bg-indigo-50 transition text-gray-700 font-medium text-lg shadow-sm active:bg-indigo-100";
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedOption, btnElement) {
            // TAP TO NEXT LOGIC: If already answered, any click goes to next
            if (isAnswered) {
                nextQuestion();
                return;
            }
            
            isAnswered = true;

            const q = currentQuestions[currentDataIndex];
            let correctToken = "";
            
            if (currentMode === 'vocab') {
                correctToken = q.m;
            } else {
                // In Phonetic mode, the answer is the letter options (which is q.word or we look it up)
                // Actually in phoneticData, options are e.g. ["th", "s", ...]. 
                // We need to know which one is correct. 
                // In phoneticData, q.options contains the answer but we need to check against q.word or similar?
                // Wait, my phoneticData structure: `word: "Think"` (example word). 
                // But `options` are ["th", "s"]. 
                // I need to store the Correct Answer Token explicitly.
                // In revised data above: `word: "th"` is the Grapheme answer.
                correctToken = q.word; 
            }

            if (selectedOption === correctToken) {
                // Correct
                score++;
                btnElement.classList.remove('bg-white', 'border-gray-200');
                btnElement.classList.add('bg-green-500', 'text-white', 'border-green-600', 'correct-anim');
                feedbackText.textContent = "ถูกต้อง! Excellent!";
                feedbackText.className = "text-lg font-bold text-green-600";
            } else {
                // Wrong
                btnElement.classList.remove('bg-white', 'border-gray-200');
                btnElement.classList.add('bg-red-500', 'text-white', 'border-red-600', 'wrong-anim');
                feedbackText.textContent = `คำตอบคือ "${correctToken}"`;
                feedbackText.className = "text-lg font-bold text-red-500";

                // Highlight correct answer
                const buttons = optionsContainer.getElementsByTagName('button');
                for (let btn of buttons) {
                    if (btn.textContent === correctToken) {
                        btn.classList.add('bg-green-100', 'text-green-800', 'border-green-300');
                    }
                }
            }
            
            // Reveal hidden word if in Vocab hidden mode
            if (currentMode === 'vocab' && ipaToggle.checked) {
                const hiddenDiv = document.getElementById('hidden-word-reveal');
                if(hiddenDiv) {
                    hiddenDiv.classList.remove('opacity-0', 'translate-y-2');
                }
            }
            
            scoreDisplay.textContent = score;
            
            // Show Tap Hint
            tapHint.classList.remove('hidden');
            feedbackArea.classList.add('bg-gray-100'); // Highlight feedback area slightly
        }

        // Global handler for Feedback Area click
        function handleFeedbackClick() {
            if (isAnswered) {
                nextQuestion();
            }
        }

        function nextQuestion() {
            totalAnswered++;
            currentDataIndex++;
            
            // Loop check: Endless Mode
            if (currentDataIndex >= currentQuestions.length) {
                currentDataIndex = 0;
                currentQuestions = shuffleArray(currentQuestions);
            }
            
            renderQuestion();
        }

        function showResult() {
            gameView.classList.remove('flex');
            gameView.classList.add('hidden');
            resultView.classList.remove('hidden');

            document.getElementById('final-score').textContent = score;
            document.getElementById('total-score').textContent = totalAnswered;

            const msgElement = document.getElementById('result-message');
            const percentage = totalAnswered > 0 ? (score / totalAnswered) * 100 : 0;

            if (totalAnswered === 0) {
                 msgElement.textContent = "ยังไม่ได้เล่นเลย ลองใหม่อีกครั้งนะ";
            } else if (percentage === 100) {
                msgElement.textContent = "สุดยอด! ถูกทุกข้อเลย";
            } else if (percentage >= 80) {
                msgElement.textContent = "เยี่ยมมาก! แม่นยำสุดๆ";
            } else if (percentage >= 50) {
                msgElement.textContent = "เก่งมาก ฝึกฝนต่อไปนะ";
            } else {
                msgElement.textContent = "สู้ๆ นะครับ ลองใหม่อีกรอบ";
            }
        }

        function retryGame() {
            if (currentMode) {
                startGame(currentMode);
            } else {
                showMenu();
            }
        }

        function showMenu() {
            resultView.classList.add('hidden');
            gameView.classList.add('hidden');
            menuView.classList.remove('hidden');
        }

    </script>
</body>
</html>
